name: Release Standalone Extension

on:
  push:
    tags:
      - 'v*-standalone'
  pull_request:
    paths:
      - 'extension-standalone/**'
      - '.github/workflows/extension-release.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  verify:
    name: Verify standalone extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          jq -e '
            .manifest_version == 3 and
            (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+(?:\\.[0-9]+)?$")) and
            (.background.service_worker | type == "string")
          ' extension-standalone/manifest.json
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected="v$(jq -r '.version' extension-standalone/manifest.json)-standalone"
            [[ "${GITHUB_REF_NAME}" == "${expected}" ]] || {
              echo "Release tag ${GITHUB_REF_NAME} must match ${expected}" >&2
              exit 1
            }
          fi

      - name: Check JavaScript syntax
        run: |
          node --check extension-standalone/background.js
          node --check extension-standalone/nga-api.js
          node --check extension-standalone/popup.js
          node --check extension-standalone/posts.js
          node --check extension-standalone/i18n.js
          node --check extension-standalone/thread-config.mjs

      - name: Run standalone extension tests
        run: node --test extension-standalone/static.test.mjs

  release:
    name: Package and Release Standalone Extension
    if: ${{ github.event_name != 'pull_request' }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="v$(jq -r '.version' extension-standalone/manifest.json)-standalone"
          fi
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"

      - name: Package standalone extension
        run: |
          cd extension-standalone
          # Create zip excluding unnecessary files
          zip -r ../extension-standalone.zip . \
            -x "*.git*" \
            -x "*README.md" \
            -x "*test.mjs" \
            -x "*.DS_Store"
          cd ..
          
          # Verify the zip was created
          ls -lh extension-standalone.zip

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## NGA Reminder Standalone Extension ${{ steps.get_version.outputs.VERSION }}
          
          ### Installation
          
          1. Download `extension-standalone.zip` below
          2. Extract the ZIP file
          3. Open Chrome → `chrome://extensions/`
          4. Enable **Developer mode** (top right)
          5. Click **Load unpacked**
          6. Select the extracted folder
          
          ### Features in this Release
          
          - 🔐 Automatic authentication via browser cookies
          - 🔔 Smart notifications (Chrome when focused, Bark when unfocused)
          - 🔗 Clickable notification URLs to jump to posts
          - ⏰ Time-based check schedules
          - 👤 Author filtering
          - 📊 Multi-thread monitoring
          - 🎯 Configurable start position
          
          ### What's New
          
          See the [Standalone README](https://github.com/${{ github.repository }}/blob/main/extension-standalone/README.md) for details.
          
          ---
          
          **Note:** This extension reads your NGA authentication cookies. This is necessary for the extension to work and all data stays in your browser.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: extension-standalone.zip
          body_path: release_notes.md
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          name: Standalone Extension ${{ steps.get_version.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact for verification
        uses: actions/upload-artifact@v4
        with:
          name: extension-standalone-${{ steps.get_version.outputs.VERSION }}
          path: extension-standalone.zip
          retention-days: 30
