name: Publish Service Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '!v*-standalone'
  pull_request:
    paths:
      - 'service/**'
      - '.github/workflows/service-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-service-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify service
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          components: rustfmt, clippy

      - name: Validate release tag
        if: ${{ github.ref_type == 'tag' }}
        run: |
          version="$(cargo metadata --manifest-path service/Cargo.toml --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "nga-reminder") | .version')"
          expected="v${version}"
          [[ "${GITHUB_REF_NAME}" == "${expected}" ]] || {
            echo "Release tag ${GITHUB_REF_NAME} must match ${expected}" >&2
            exit 1
          }

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: service

      - name: Check formatting
        run: cargo fmt --manifest-path service/Cargo.toml --all -- --check

      - name: Run tests
        run: cargo test --manifest-path service/Cargo.toml --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --manifest-path service/Cargo.toml --locked --all-targets --all-features -- -D warnings

  publish:
    name: Build and publish service image
    if: ${{ github.event_name != 'pull_request' }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./service
          file: ./service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=service-image
          cache-to: type=gha,mode=max,scope=service-image
          provenance: true
          sbom: true
