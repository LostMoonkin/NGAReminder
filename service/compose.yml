services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: nga_reminder
      POSTGRES_USER: nga_reminder
      POSTGRES_PASSWORD: nga_reminder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nga_reminder -d nga_reminder"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
    command: ["all"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NGA_REMINDER__API_TOKEN: ${NGA_REMINDER__API_TOKEN:-change-me-for-local-development}
      NGA_REMINDER__ADMIN_PASSWORD: ${NGA_REMINDER__ADMIN_PASSWORD:-change-me-for-local-development}
      NGA_REMINDER__CREDENTIAL_ENCRYPTION_KEY: ${NGA_REMINDER__CREDENTIAL_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      NGA_REMINDER__DATABASE_URL: postgres://nga_reminder:nga_reminder@postgres:5432/nga_reminder
      NGA_REMINDER__DATABASE_BACKEND: postgres
      NGA_REMINDER__BIND_ADDR: 0.0.0.0:8080
      NGA_REMINDER__OBSERVABILITY__LOG_JSON: "true"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
